server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cupkat_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:cupkat_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
email.brevo-api-key=${BREVO_API_KEY:}
email.remetente-email=${EMAIL_REMETENTE:}
email.remetente-nome=Cupkat